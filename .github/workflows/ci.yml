name: CI

# Every step here runs against mocked LLM responses and the bundled in-process
# demo app -- no network access and no API key are required. See
# integration.yml for the separate, manually-triggered workflow that exercises
# a real LLM provider.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -e ".[dev,demo]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Type check (mypy)
        run: mypy src

      - name: Run test suite
        run: pytest -v --cov=redline --cov-report=term-missing

      - name: CLI smoke test
        run: |
          redline validate --spec examples/taskapi.yaml
