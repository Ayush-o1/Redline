[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redline"
version = "0.1.0"
description = "AI-assisted API test planning, generation, validation, execution and regression tool"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ayush Kumar" }]
dependencies = [
    "pydantic>=2.6,<3",
    "PyYAML>=6.0,<7",
    "click>=8.1,<9",
    "httpx>=0.27,<1",
    "openai>=1.30,<2",
    "pytest-json-report>=1.5,<2",
]

[project.optional-dependencies]
demo = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
dev = [
    "pytest>=8.0,<9",
    "pytest-cov>=5.0,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-PyYAML",
]

[project.scripts]
redline = "redline.cli.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_defs = false
